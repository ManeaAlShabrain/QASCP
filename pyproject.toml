[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qascp-foundation"
version = "0.1.0"
description = "QASCP internal tenant foundation"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.165.0", "uvicorn==0.54.0", "PyJWT==2.15.1", "cryptography==50.0.2", "psycopg==3.3.9", "psycopg-binary==3.3.9", "psycopg-pool==3.3.3"]

[project.scripts]
qascp-serve = "qascp.server:main"
qascp-migrate = "qascp.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qascp = ["migrations/*.sql"]
