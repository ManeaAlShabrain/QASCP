name: QASCP Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify checkout authentication boundary
        run: |
          python3 --version
          git --version
          python3 - <<'PY'
          import subprocess

          result = subprocess.run(
              ["git", "config", "--local", "--name-only", "--get-regexp",
               r"^(http(\..*)?\.extraheader|credential\..*|core\.sshcommand)$"],
              capture_output=True, text=True, check=False)
          if result.returncode not in (0, 1):
              raise SystemExit("Cannot inspect local checkout authentication configuration")
          if result.stdout.strip():
              raise SystemExit("Prohibited checkout authentication configuration remains")
          print("No local checkout auth headers, credential helpers or SSH command remain")
          PY
      - name: Validate foundations
        run: python3 scripts/verify_foundation.py
      - name: Install pinned contract validation tools
        run: |
          python3 -m venv .venv-contracts
          .venv-contracts/bin/python -m pip install --disable-pip-version-check --no-input --index-url https://pypi.org/simple --no-deps --only-binary=:all: -r requirements-contracts.txt
          .venv-contracts/bin/python -m pip check
      - name: Validate both full OpenAPI documents offline
        run: .venv-contracts/bin/python scripts/verify_openapi_contracts.py
      - name: Test foundation and contract schemas
        run: .venv-contracts/bin/python -m unittest discover -s tests -v

  gate:
    name: QASCP Foundation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [foundation]
    if: ${{ always() }}
    steps:
      - name: Require successful verification
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
        run: test "$FOUNDATION_RESULT" = success
